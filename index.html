<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Lil Taz’s Rooftop Run</title>

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   user-scalable=no,
                   viewport-fit=cover,
                   interactive-widget=resizes-content">


    <style>

        /* =========================================================
           GLOBAL
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 42%, #26365d 0%, #111b38 45%, #050918 100%);
            touch-action: none;
            position: fixed;
            inset: 0;
        }


        body {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
        }


        /* =========================================================
           MOBILE BACKGROUND

           This is visible around the landscape Unity game
           when the phone is held vertically.
           ========================================================= */

        #mobile-background {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: radial-gradient(ellipse at 50% 42%, #26365d 0%, #111b38 45%, #050918 100%);
            z-index: 0;
            display: block;
            pointer-events: none;
        }

        /* Decorative city atmosphere outside the Unity game only. */
        #city-theme {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
            background-image: radial-gradient(1px 1px at 8% 14%, #c4d2ef 99%, transparent), radial-gradient(1px 1px at 22% 33%, #b4c7ec 99%, transparent), radial-gradient(2px 2px at 78% 16%, #d4dbeb 99%, transparent), radial-gradient(1px 1px at 91% 36%, #d4dbeb 99%, transparent), radial-gradient(1px 1px at 64% 8%, #b4c7ec 99%, transparent);
        }

            #city-theme::before {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient(ellipse at 50% 48%, rgba(83,111,170,.19), transparent 65%);
            }

        .city-skyline {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: min(32vh, 270px);
            opacity: .82;
            background: #080e20;
            clip-path: polygon(0 35%, 5% 35%, 5% 52%, 9% 52%, 9% 16%, 13% 16%, 13% 43%, 18% 43%, 18% 30%, 23% 30%, 23% 57%, 29% 57%, 29% 23%, 33% 23%, 33% 46%, 39% 46%, 39% 9%, 43% 9%, 43% 38%, 49% 38%, 49% 54%, 54% 54%, 54% 28%, 60% 28%, 60% 48%, 66% 48%, 66% 15%, 70% 15%, 70% 39%, 76% 39%, 76% 26%, 81% 26%, 81% 53%, 86% 53%, 86% 19%, 91% 19%, 91% 44%, 96% 44%, 96% 31%, 100% 31%, 100% 100%, 0 100%);
        }

            .city-skyline::after {
                content: "";
                position: absolute;
                inset: 0;
                background-image: radial-gradient(#c18e53 1px, transparent 1.7px);
                background-size: 23px 29px;
                opacity: .36;
            }

        .rooftop-edge {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 14px;
            border-top: 2px solid rgba(154,119,67,.35);
            background: repeating-linear-gradient(110deg, #111727 0 32px, #1b2333 32px 35px);
        }

        @media (prefers-reduced-motion: no-preference) {
            #city-theme::before {
                animation: city-glow 9s ease-in-out infinite alternate;
            }

            @keyframes city-glow {
                from {
                    opacity: .5;
                }

                to {
                    opacity: 1;
                }
            }
        }


        /* =========================================================
           UNITY CONTAINER

           IMPORTANT:
           Unity remains 960 x 600 / 16:10.
           ========================================================= */

        #unity-container {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 960px;
            height: 600px;
            transform: translate(-50%, -50%);
            overflow: hidden;
            background: #000;
            z-index: 10;
        }


        /* =========================================================
           UNITY CANVAS
           ========================================================= */

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            outline: none;
            touch-action: none;
        }


        /* =========================================================
           LOADING SCREEN

           Restored from your previous version.
           Full browser / mobile screen.
           ========================================================= */

        #loading-screen {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 1000;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }


        /* =========================================================
           LOADING LOGO
           ========================================================= */

        #loading-logo {
            color: #00ffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 52px;
            font-weight: bold;
            margin-bottom: 50px;
            text-align: center;
            text-shadow: 0 0 10px cyan, 0 0 20px cyan, 0 0 40px cyan;
            line-height: 1.2;
        }


        /* =========================================================
           LOADING BAR
           ========================================================= */

        #loading-bar {
            width: 420px;
            max-width: 80vw;
            height: 22px;
            background: #222;
            border-radius: 20px;
            overflow: hidden;
        }


        #loading-fill {
            width: 0%;
            height: 100%;
            background: #00ffff;
            transition: width 0.2s ease;
        }


        /* =========================================================
           LOADING PERCENT
           ========================================================= */

        #loading-percent {
            margin-top: 20px;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 24px;
            text-align: center;
        }


        /* =========================================================
           LOADING TEXT
           ========================================================= */

        #loading-text {
            margin-top: 10px;
            color: #aaa;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
            text-align: center;
        }


        /* =========================================================
           FULLSCREEN BUTTON
           ========================================================= */

        #unity-fullscreen-button {
            position: fixed;
            right: calc(15px + env(safe-area-inset-right));
            bottom: calc(15px + env(safe-area-inset-bottom));
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            z-index: 500;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }


            #unity-fullscreen-button:hover {
                background: rgba(0, 0, 0, 0.9);
            }


        /* =========================================================
           DESKTOP

           Desktop stays landscape.
           ========================================================= */

        @media screen and (min-width: 769px) {

            #unity-container {
                width: min(960px, 100vw);
                height: min(600px, 100vh);
                aspect-ratio: 16 / 10;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
            }


            #unity-canvas {
                width: 100%;
                height: 100%;
            }
        }


        /* =========================================================
           MOBILE LANDSCAPE

           Example:
           844 x 390

           Game becomes approximately:
           624 x 390
           while preserving 16:10.
           ========================================================= */

        @media screen and (max-width: 768px) and (orientation: landscape) {

            #mobile-background {
                display: block;
            }


            #unity-container {
                width: 100vw;
                height: 100dvh;
                max-width: 100vw;
                max-height: 100dvh;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                aspect-ratio: 16 / 10;
            }


            #unity-canvas {
                width: 100%;
                height: 100%;
            }


            #unity-fullscreen-button {
                display: flex;
            }


            #loading-logo {
                font-size: 38px;
                margin-bottom: 35px;
            }


            #loading-bar {
                width: 320px;
                max-width: 75vw;
            }


            #loading-percent {
                font-size: 20px;
            }


            #loading-text {
                font-size: 16px;
            }
        }


        /* =========================================================
           MOBILE PORTRAIT

           IMPORTANT:

           PHONE = PORTRAIT
           UNITY GAME = LANDSCAPE

           The Unity game is centered.
           It is NEVER stretched to 9:16.
           ========================================================= */

        @media screen and (max-width: 768px) and (orientation: portrait) {

            #mobile-background {
                display: block;
            }


            #unity-container {
                /*
                 * Use phone width minus a small margin.
                 */

                width: calc(100vw - 20px);
                /*
                 * Maintain 960 / 600 ratio.
                 */

                height: calc( (100vw - 20px) * 600 / 960 );
                max-width: calc(100vw - 20px);
                max-height: calc(100dvh - 20px);
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                aspect-ratio: 16 / 10;
            }


            #unity-canvas {
                width: 100%;
                height: 100%;
            }


            /*
             * Hide fullscreen button in portrait.
             */

            #unity-fullscreen-button {
                display: none;
            }


            /*
             * Loading remains full portrait screen.
             */

            #loading-logo {
                font-size: clamp( 28px, 8vw, 40px );
                margin-bottom: clamp( 25px, 7vw, 40px );
                padding: 0 20px;
            }


            #loading-bar {
                width: min(320px, 78vw);
                height: 18px;
            }


            #loading-percent {
                font-size: 20px;
            }


            #loading-text {
                font-size: 16px;
            }
        }


        /* =========================================================
           VERY SMALL PORTRAIT PHONES
           ========================================================= */

        @media screen and (max-width: 400px) and (orientation: portrait) {

            #unity-container {
                width: calc(100vw - 12px);
                height: calc( (100vw - 12px) * 600 / 960 );
                max-width: calc(100vw - 12px);
            }


            #loading-logo {
                font-size: 28px;
            }


            #loading-bar {
                width: 260px;
                max-width: 75vw;
            }
        }


        /* =========================================================
           MOBILE ONLY: PORTRAIT ROTATE OVERLAY
           ========================================================= */

        #portrait-overlay {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 24px;
            background: #050918;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            touch-action: manipulation;
        }

        .rotate-icon {
            font-size: 72px;
            line-height: 1;
            margin-bottom: 18px;
        }

        .rotate-title {
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .rotate-text {
            max-width: 340px;
            font-size: 16px;
            line-height: 1.45;
            color: #cbd4ea;
            margin-bottom: 22px;
        }

        #rotate-fullscreen-button {
            min-width: 220px;
            min-height: 50px;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #fff;
            color: #10182d;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
        }

        @media screen and (max-width: 768px) and (orientation: portrait) {
            #unity-container {
                display: none !important;
            }

            #unity-fullscreen-button {
                display: none !important;
            }

            #portrait-overlay {
                display: flex !important;
            }
        }


        /* =========================================================
           SAFE AREA
           ========================================================= */

        @supports (padding: env(safe-area-inset-top)) {

            #unity-container {
                /*
                 * Don't add padding to Unity.
                 * Safe area is handled by viewport/background.
                 */
            }
        }
    </style>

</head>


<body>


    <!-- =========================================================
         BACKGROUND
         ========================================================= -->

    <div id="mobile-background"></div>
    <div id="city-theme" aria-hidden="true">
        <div class="city-skyline"></div>
        <div class="rooftop-edge"></div>
    </div>


    <!-- =========================================================
         UNITY
         ========================================================= -->

    <div id="unity-container">

        <canvas id="unity-canvas"
                width="960"
                height="600"
                tabindex="-1">
        </canvas>

    </div>


    <!-- =========================================================
         LOADING SCREEN

         This is the same style as your previous loading screen.
         ========================================================= -->

    <div id="loading-screen">

        <div id="loading-logo">
            Lil Taz’s Rooftop Run
        </div>


        <div id="loading-bar">

            <div id="loading-fill"></div>

        </div>


        <div id="loading-percent">
            0%
        </div>


        <div id="loading-text">
            Loading...
        </div>

    </div>


    <!-- =========================================================
         FULLSCREEN
         ========================================================= -->

    <div id="unity-fullscreen-button">
        ⛶
    </div>

    <!-- MOBILE ONLY: shown when the phone is held vertically -->
    <div id="portrait-overlay">
        <div class="rotate-icon">⟳</div>
        <div class="rotate-title">Please rotate your phone</div>
        <div class="rotate-text">This game is designed to play in landscape mode.</div>
        <button id="rotate-fullscreen-button" type="button">ROTATE / FULLSCREEN</button>
    </div>


    <script>


        /* =========================================================
           UNITY CONFIG

           SAME BUILD FILES FROM YOUR ORIGINAL HTML
           ========================================================= */

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/91fa5c27ae02a9be1ef88bc143db8adb.loader.js";
        const config = {
            arguments: [],
            dataUrl: buildUrl + "/c609fc585ac029763c4164ae0a60efaa.data.unityweb",
            frameworkUrl: buildUrl + "/a39a7ca4ba6923980b775f5618c0ac5e.framework.js.unityweb",
            codeUrl: buildUrl + "/71f16aca77cd12b36d965cfb1694626d.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Lil Taz’s Rooftop Run",
            productVersion: "1.0",
            devicePixelRatio: 1,
            preserveDrawingBuffer: true
        };
    

        /* =========================================================
           GAME SIZE
           ========================================================= */

        const GAME_WIDTH = 960;

        const GAME_HEIGHT = 600;

        const GAME_RATIO =
            GAME_WIDTH / GAME_HEIGHT;


        /* =========================================================
           ELEMENTS
           ========================================================= */

        const canvas = document.getElementById("unity-canvas");
        const container = document.getElementById("unity-container");
        const loadingScreen = document.getElementById("loading-screen");
        const loadingFill = document.getElementById("loading-fill");
        const loadingPercent = document.getElementById("loading-percent");
        const fullscreenButton = document.getElementById("unity-fullscreen-button");


        /* =========================================================
           DEVICE
           ========================================================= */

        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);


        /* =========================================================
           GET VIEWPORT

           visualViewport is important for mobile browsers
           and keyboard resizing.
           ========================================================= */

        function getViewport() {

            let width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
            let height = window.visualViewport ? window.visualViewport.height : window.innerHeight;

            return {

                width: width,

                height: height
            };
        }


        /* =========================================================
           RESIZE GAME

           CORE FIX:

           Never stretch Unity 960x600
           into portrait 9:16.

           Always preserve 16:10.
           ========================================================= */

        function resizeGame() {

            const viewport = getViewport();
            const vw = viewport.width;
            const vh = viewport.height;

            /* =====================================================
               DESKTOP
               Keep desktop behavior unchanged.
               ===================================================== */

            if (!isMobile) {

                let width = Math.min(vw, GAME_WIDTH);
                let height = width / GAME_RATIO;

                if (height > vh) {
                    height = vh;
                    width = height * GAME_RATIO;
                }

                container.style.position = "fixed";
                container.style.left = "50%";
                container.style.top = "50%";
                container.style.width = Math.floor(width) + "px";
                container.style.height = Math.floor(height) + "px";
                container.style.transform = "translate(-50%, -50%)";
                container.style.display = "block";

                canvas.style.width = "100%";
                canvas.style.height = "100%";

                return;
            }

            /* =====================================================
               MOBILE PORTRAIT
               Unity is hidden. Ask the player to rotate.
               ===================================================== */

            if (vh > vw) {
                container.style.display = "none";
                fullscreenButton.style.display = "none";
                document.getElementById("portrait-overlay").style.display = "flex";
                return;
            }

            /* =====================================================
               MOBILE LANDSCAPE
               Fill available viewport while preserving 16:10.
               ===================================================== */

            document.getElementById("portrait-overlay").style.display = "none";
            fullscreenButton.style.display = "flex";

            let width = vw;
            let height = width / GAME_RATIO;

            if (height > vh) {
                height = vh;
                width = height * GAME_RATIO;
            }

            container.style.position = "fixed";
            container.style.left = "50%";
            container.style.top = "50%";
            container.style.width = Math.floor(width) + "px";
            container.style.height = Math.floor(height) + "px";
            container.style.transform = "translate(-50%, -50%)";
            container.style.display = "block";

            canvas.style.width = "100%";
            canvas.style.height = "100%";
        }


        /* =========================================================
           INITIAL RESIZE
           ========================================================= */

        resizeGame();


        /* =========================================================
           DEBOUNCED RESIZE
           ========================================================= */

        let resizeTimeout = null;


        function handleResize() {

            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function () { resizeGame(); }, 100);
        }


        /* =========================================================
           WINDOW RESIZE
           ========================================================= */

        window.addEventListener("resize", handleResize, {
            passive: true
        }
        );


        /* =========================================================
           VISUAL VIEWPORT
           ========================================================= */

        if (window.visualViewport) {

            window.visualViewport.addEventListener("resize", handleResize,
                {
                    passive: true
                }
            );
            window.visualViewport.addEventListener("scroll", handleResize, {
                passive: true
            }
            );
        }


        /* =========================================================
           ORIENTATION CHANGE
           ========================================================= */

        window.addEventListener("orientationchange", function () {

            setTimeout(resizeGame, 100);
            setTimeout(resizeGame, 300);
            setTimeout(resizeGame, 700);
        },
            {
                passive: true
            }
        );


        /* =========================================================
           CANVAS CONTEXT MENU
           ========================================================= */

        canvas.addEventListener("contextmenu", function (event) {
            event.preventDefault();

        }
        );


        /* =========================================================
           LOAD UNITY
           ========================================================= */

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
            const finalConfig = { ...config, preserveDrawingBuffer: true };
            createUnityInstance(canvas, finalConfig,

                function (progress) {

                    /*
                     * Unity progress:
                     * 0.0 -> 1.0
                     */

                    const percent = Math.floor(progress * 100);
                    loadingFill.style.width = percent + "%";
                    loadingPercent.textContent = percent + "%";
                    if (percent >= 100) {

                        loadingPercent.textContent = "100%";
                    }
                }

            )
                .then(function (unityInstance) {

                    /*
                     * Store instance globally.
                     */

                    window.unityInstance = unityInstance;
                    /*
                     * Make sure final game
                     * position is correct.
                     */
                    resizeGame();
                    /*
                     * Give Unity a moment to
                     * finish its first frame.
                     */
                    setTimeout(function () {

                        loadingScreen.style.display = "none";
                        resizeGame();
                    }, 150);

                }
                )
                .catch(function (message) {

                    console.error("Unity WebGL Error:", message);
                    loadingPercent.textContent = "Error";
                    document.getElementById("loading-text").textContent = "Unable to load game";
                    alert(message);
                }
                );
        };


        script.onerror = function () {

            console.error("Unity loader failed:", loaderUrl);
            loadingPercent.textContent = "Error";
            document.getElementById("loading-text").textContent = "Unable to load game.";
        };


        document.body.appendChild(script);

        /* =========================================================
           FULLSCREEN
           ========================================================= */

        async function enterMobileFullscreenLandscape() {

            if (!isMobile) {
                return;
            }

            /* Fullscreen must be requested from a user gesture. */
            try {
                if (!document.fullscreenElement) {
                    const root = document.documentElement;

                    if (root.requestFullscreen) {
                        await root.requestFullscreen();
                    }
                    else if (root.webkitRequestFullscreen) {
                        root.webkitRequestFullscreen();
                    }
                }
            }
            catch (error) {
                console.log("Browser fullscreen unavailable:", error);
            }

            /* Orientation lock is supported on some mobile browsers,
               especially Android Chrome. */
            try {
                if (screen.orientation && screen.orientation.lock) {
                    try {
                        await screen.orientation.lock("landscape-primary");
                    }
                    catch (error) {
                        try {
                            await screen.orientation.lock("landscape");
                        }
                        catch (lockError) {
                            console.log("Landscape lock unavailable:", lockError);
                        }
                    }
                }
            }
            catch (error) {
                console.log("Orientation lock unavailable:", error);
            }

            if (window.unityInstance) {
                try {
                    window.unityInstance.SetFullscreen(1);
                }
                catch (error) {
                    console.log("Unity fullscreen unavailable:", error);
                }
            }

            setTimeout(resizeGame, 300);
            setTimeout(resizeGame, 800);
        }


        fullscreenButton.addEventListener("click", function () {

            /* Desktop behavior remains exactly the same. */
            if (!isMobile) {

                if (window.unityInstance) {
                    window.unityInstance.SetFullscreen(1);
                }

                return;
            }

            enterMobileFullscreenLandscape();
        });


        document.getElementById("rotate-fullscreen-button")
            .addEventListener("click", function (event) {

                event.preventDefault();
                event.stopPropagation();

                enterMobileFullscreenLandscape();
            });


        /* =========================================================
           KEYBOARD / INPUT FOCUS
           ========================================================= */

        document.addEventListener("focusin", function (event) {

            if (event.target.tagName === "INPUT" ||
                event.target.tagName === "TEXTAREA") {

                setTimeout(resizeGame, 300);
            }
        }
        );


        document.addEventListener("focusout", function (event) {

            if (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA") {

                setTimeout(resizeGame, 300);
            }
        }
        );


        /* =========================================================
           ANDROID
           ========================================================= */

        if (/Android/i.test(navigator.userAgent)) {

            document.addEventListener("visibilitychange", function () {

                if (!document.hidden) {

                    setTimeout(resizeGame, 300);
                }
            }
            );


            window.addEventListener("scroll", function () {

                if (window.innerWidth > window.innerHeight) {

                    setTimeout(resizeGame, 100);
                }
            },
                {
                    passive: true
                }
            );
        }


        /* =========================================================
           IOS SAFARI
           ========================================================= */

        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {

            document.addEventListener("gesturestart", function (event) {
                event.preventDefault();

            }
            );

            window.addEventListener("resize",
                function () {

                    setTimeout(resizeGame, 500);

                },
                {
                    passive: true
                }
            );
        }


        /* =========================================================
           PREVENT DOUBLE-TAP ZOOM
           ========================================================= */

        document.addEventListener("dblclick", function (event) {
            event.preventDefault();
        },
            {
                passive: false
            }
        );


    </script>

</body>

</html>
