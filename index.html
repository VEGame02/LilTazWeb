
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Lil Taz’s Rooftop Run</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

    <meta name="theme-color" content="#050918">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #050918;
            touch-action: none;
            overscroll-behavior: none;
        }

        button {
            font: inherit;
        }

        /* Background */

        #mobile-background {
            position: fixed;
            inset: 0;
            background: radial-gradient( ellipse at 50% 42%, #26365d 0%, #111b38 45%, #050918 100% );
            z-index: 0;
            pointer-events: none;
        }

        #city-theme {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
            background-image: radial-gradient(1px 1px at 8% 14%, #c4d2ef 99%, transparent), radial-gradient(1px 1px at 22% 33%, #b4c7ec 99%, transparent), radial-gradient(2px 2px at 78% 16%, #d4dbeb 99%, transparent), radial-gradient(1px 1px at 91% 36%, #d4dbeb 99%, transparent), radial-gradient(1px 1px at 64% 8%, #b4c7ec 99%, transparent);
        }

            #city-theme::before {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient( ellipse at 50% 48%, rgba(83,111,170,.19), transparent 65% );
            }

        .city-skyline {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: min(32vh, 270px);
            opacity: .82;
            background: #080e20;
            clip-path: polygon( 0 35%, 5% 35%, 5% 52%, 9% 52%, 9% 16%, 13% 16%, 13% 43%, 18% 43%, 18% 30%, 23% 30%, 23% 57%, 29% 57%, 29% 23%, 33% 23%, 33% 46%, 39% 46%, 39% 9%, 43% 9%, 43% 38%, 49% 38%, 49% 54%, 54% 54%, 54% 28%, 60% 28%, 60% 48%, 66% 48%, 66% 15%, 70% 15%, 70% 39%, 76% 39%, 76% 26%, 81% 26%, 81% 53%, 86% 53%, 86% 19%, 91% 19%, 91% 44%, 96% 44%, 96% 31%, 100% 31%, 100% 100%, 0 100% );
        }

            .city-skyline::after {
                content: "";
                position: absolute;
                inset: 0;
                background-image: radial-gradient( #c18e53 1px, transparent 1.7px );
                background-size: 23px 29px;
                opacity: .36;
            }

        .rooftop-edge {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 14px;
            border-top: 2px solid rgba(154,119,67,.35);
            background: repeating-linear-gradient( 110deg, #111727 0 32px, #1b2333 32px 35px );
        }

        @media (prefers-reduced-motion: no-preference) {
            #city-theme::before {
                animation: city-glow 9s ease-in-out infinite alternate;
            }

            @keyframes city-glow {
                from {
                    opacity: .5;
                }

                to {
                    opacity: 1;
                }
            }
        }

        /* Unity container: 960 x 600 reference */

        #unity-container {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 960px;
            height: 600px;
            transform: translate(-50%, -50%);
            overflow: hidden;
            background: #000;
            z-index: 10;
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            outline: none;
            background: #000;
            touch-action: none;
        }

        /* Loading screen */

        #loading-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 1000;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        #loading-logo {
            max-width: 90vw;
            padding: 0 12px;
            margin-bottom: 50px;
            color: #00ffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 52px;
            font-weight: bold;
            line-height: 1.2;
            text-align: center;
            text-shadow: 0 0 10px cyan, 0 0 20px cyan, 0 0 40px cyan;
        }

        #loading-bar {
            width: 420px;
            max-width: 80vw;
            height: 22px;
            overflow: hidden;
            border-radius: 20px;
            background: #222;
        }

        #loading-fill {
            width: 0%;
            height: 100%;
            background: #00ffff;
            transition: width .2s ease;
        }

        #loading-percent {
            margin-top: 20px;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 24px;
            text-align: center;
        }

        #loading-text {
            max-width: 90vw;
            margin-top: 10px;
            color: #aaa;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
            text-align: center;
        }

        /* Fullscreen toggle button */

        #unity-fullscreen-button {
            position: fixed;
            right: calc(15px + env(safe-area-inset-right));
            bottom: calc(15px + env(safe-area-inset-bottom));
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 8px;
            background: rgba(0,0,0,.65);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            z-index: 500;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

            #unity-fullscreen-button:hover {
                background: rgba(0,0,0,.9);
            }

        /* Portrait rotate overlay */

        #portrait-overlay {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
            text-align: center;
            background: #050918;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            touch-action: manipulation;
        }

        .rotate-icon {
            margin-bottom: 18px;
            font-size: 72px;
            line-height: 1;
        }

        .rotate-title {
            margin-bottom: 10px;
            font-size: 27px;
            font-weight: 700;
        }

        .rotate-text {
            max-width: 340px;
            margin-bottom: 22px;
            color: #cbd4ea;
            font-size: 16px;
            line-height: 1.45;
        }

        #rotate-fullscreen-button {
            min-width: 220px;
            min-height: 50px;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #fff;
            color: #10182d;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* Responsive loading UI */

        @media screen and (max-width: 768px) {
            #loading-logo {
                font-size: clamp(26px, 5vw, 38px);
                margin-bottom: 25px;
            }

            #loading-bar {
                height: 18px;
            }

            #loading-percent {
                font-size: 20px;
            }

            #loading-text {
                font-size: 16px;
            }
        }

        /* Portrait mode: show rotate overlay */

        @media screen and (max-width: 768px) and (orientation: portrait) {
            #unity-container {
                display: none !important;
            }

            #unity-fullscreen-button {
                display: none !important;
            }

            #portrait-overlay {
                display: flex;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div id="mobile-background"></div>

    <div id="city-theme" aria-hidden="true">
        <div class="city-skyline"></div>
        <div class="rooftop-edge"></div>
    </div>

    <!-- Unity -->
    <div id="unity-container">
        <canvas id="unity-canvas"
                width="960"
                height="600"
                tabindex="-1">
        </canvas>
    </div>

    <!-- Loading screen -->
    <div id="loading-screen">
        <div id="loading-logo">Lil Taz’s Rooftop Run</div>

        <div id="loading-bar">
            <div id="loading-fill"></div>
        </div>

        <div id="loading-percent">0%</div>
        <div id="loading-text">Loading...</div>
    </div>

    <!-- Fullscreen toggle -->
    <button id="unity-fullscreen-button"
            type="button"
            aria-label="Enter fullscreen"
            title="Enter fullscreen">
        ⛶
    </button>

    <!-- Portrait overlay -->
    <div id="portrait-overlay">
        <div class="rotate-icon" aria-hidden="true">⟳</div>

        <div class="rotate-title">Please rotate your phone</div>

        <div class="rotate-text">
            Lil Taz’s Rooftop Run is designed to play in landscape mode.
            Turn your phone sideways to continue.
        </div>

        <button id="rotate-fullscreen-button" type="button">
            ROTATE / FULLSCREEN
        </button>
    </div>

    <script>
        "use strict";

        /* Unity Build configuration: filenames preserved */

        const buildUrl = "Build";

        const loaderUrl =
            buildUrl + "/91fa5c27ae02a9be1ef88bc143db8adb.loader.js";

        const config = {
            arguments: [],

            dataUrl:
                buildUrl + "/592912b618a344a3688ce842bc8ccfdf.data.unityweb",

            frameworkUrl:
                buildUrl + "/a39a7ca4ba6923980b775f5618c0ac5e.framework.js.unityweb",

            codeUrl:
                buildUrl + "/71f16aca77cd12b36d965cfb1694626d.wasm.unityweb",

            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Lil Taz’s Rooftop Run",
            productVersion: "1.0",
            devicePixelRatio: 1,
            preserveDrawingBuffer: true
        };

       
        const GAME_WIDTH = 960;
        const GAME_HEIGHT = 600;
        const GAME_RATIO = GAME_WIDTH / GAME_HEIGHT;

        const canvas = document.getElementById("unity-canvas");
        const container = document.getElementById("unity-container");
        const loadingScreen = document.getElementById("loading-screen");
        const loadingFill = document.getElementById("loading-fill");
        const loadingPercent = document.getElementById("loading-percent");
        const loadingText = document.getElementById("loading-text");
        const fullscreenButton = document.getElementById("unity-fullscreen-button");
        const portraitOverlay = document.getElementById("portrait-overlay");
        const rotateButton = document.getElementById("rotate-fullscreen-button");

        /*
         * Detect phones and tablets, including iPads that identify
         * themselves as Macintosh computers.
         */
        const isMobile =
            /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
            (
                navigator.maxTouchPoints > 1 &&
                /Macintosh/i.test(navigator.userAgent)
            );

        let unityInstance = null;
        let resizeFrame = null;
        let fullscreenBusy = false;

        function getViewport() {
            const viewport = window.visualViewport;

            return {
                width: Math.max(
                    1,
                    viewport ? viewport.width : window.innerWidth
                ),
                height: Math.max(
                    1,
                    viewport ? viewport.height : window.innerHeight
                )
            };
        }

        /*
         * Keep the original 16:10 ratio.
         * Never stretch the game to match the device's aspect ratio.
         */
        function calculateGameSize(viewportWidth, viewportHeight) {
            let width = Math.min(viewportWidth, GAME_WIDTH);
            let height = width / GAME_RATIO;

            if (height > viewportHeight) {
                height = Math.min(viewportHeight, GAME_HEIGHT);
                width = height * GAME_RATIO;
            }

            return {
                width: Math.max(1, Math.floor(width)),
                height: Math.max(1, Math.floor(height))
            };
        }

        function applyGameSize(width, height) {
            container.style.position = "fixed";
            container.style.left = "50%";
            container.style.top = "50%";
            container.style.width = width + "px";
            container.style.height = height + "px";
            container.style.transform = "translate(-50%, -50%)";
            container.style.display = "block";

            canvas.style.width = "100%";
            canvas.style.height = "100%";
        }

        function resizeGame() {
            const viewport = getViewport();
            const portrait =
                viewport.height > viewport.width;

            if (isMobile && portrait) {
                container.style.display = "none";
                fullscreenButton.style.display = "none";
                portraitOverlay.style.display = "flex";
                return;
            }

            portraitOverlay.style.display = "none";

            const size = calculateGameSize(
                viewport.width,
                viewport.height
            );

            applyGameSize(size.width, size.height);

            fullscreenButton.style.display = "flex";
        }

        function handleResize() {
            if (resizeFrame !== null) {
                cancelAnimationFrame(resizeFrame);
            }

            resizeFrame = requestAnimationFrame(function () {
                resizeFrame = null;
                resizeGame();
            });
        }

        function handleOrientationChange() {
            handleResize();
            setTimeout(handleResize, 150);
            setTimeout(handleResize, 400);
            setTimeout(handleResize, 800);
        }

        resizeGame();

        window.addEventListener("resize", handleResize, {
            passive: true
        });

        window.addEventListener(
            "orientationchange",
            handleOrientationChange,
            { passive: true }
        );

        window.addEventListener("pageshow", handleOrientationChange);

        if (window.visualViewport) {
            window.visualViewport.addEventListener(
                "resize",
                handleResize,
                { passive: true }
            );
        }

        document.addEventListener(
            "visibilitychange",
            function () {
                if (!document.hidden) {
                    handleOrientationChange();
                }
            }
        );

        canvas.addEventListener("contextmenu", function (event) {
            event.preventDefault();
        });

        document.addEventListener("dblclick", function (event) {
            event.preventDefault();
        }, { passive: false });

        /*
         * Fullscreen helpers support standard and WebKit APIs.
         */
        function isFullscreenActive() {
            return !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement
            );
        }

        async function requestBrowserFullscreen() {
            const target = document.documentElement;

            if (target.requestFullscreen) {
                await target.requestFullscreen();
                return true;
            }

            if (target.webkitRequestFullscreen) {
                target.webkitRequestFullscreen();
                return true;
            }

            return false;
        }

        async function exitBrowserFullscreen() {
            if (document.exitFullscreen) {
                await document.exitFullscreen();
                return true;
            }

            if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
                return true;
            }

            return false;
        }

        async function tryLandscapeLock() {
            if (
                !isMobile ||
                !screen.orientation ||
                typeof screen.orientation.lock !== "function"
            ) {
                return;
            }

            try {
                await screen.orientation.lock("landscape");
            } catch (error) {
                /*
                 * Some browsers only allow orientation locking in
                 * fullscreen; iOS Safari may not support it.
                 */
                console.info("Landscape lock unavailable in this browser.");
            }
        }

        function updateFullscreenButton() {
            const active = isFullscreenActive();

            fullscreenButton.title = active
                ? "Exit fullscreen"
                : "Enter fullscreen";

            fullscreenButton.setAttribute(
                "aria-label",
                fullscreenButton.title
            );

            fullscreenButton.textContent = "⛶";
        }

        /*
         * One button toggles fullscreen on mobile and desktop.
         */
        async function toggleFullscreen() {
            if (fullscreenBusy) {
                return;
            }

            fullscreenBusy = true;

            try {
                if (isFullscreenActive()) {
                    await exitBrowserFullscreen();
                } else if (isMobile) {
                    const entered = await requestBrowserFullscreen();

                    /*
                     * Fall back to Unity fullscreen if the browser's
                     * fullscreen API is unavailable.
                     */
                    if (!entered && unityInstance) {
                        unityInstance.SetFullscreen(1);
                    }

                    await tryLandscapeLock();
                } else if (unityInstance) {
                    unityInstance.SetFullscreen(1);
                }
            } catch (error) {
                console.warn("Fullscreen toggle failed:", error);
            } finally {
                fullscreenBusy = false;

                handleOrientationChange();
                updateFullscreenButton();
            }
        }

        fullscreenButton.addEventListener("click", toggleFullscreen);

        /*
         * The rotate overlay button attempts fullscreen and landscape
         * locking. On devices that reject it, rotate the device manually.
         */
        rotateButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            toggleFullscreen();
        });

        document.addEventListener("fullscreenchange", function () {
            handleOrientationChange();
            updateFullscreenButton();
        });

        document.addEventListener("webkitfullscreenchange", function () {
            handleOrientationChange();
            updateFullscreenButton();
        });

        /*
         * Load Unity.
         */
        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = function () {
            if (typeof createUnityInstance !== "function") {
                showLoadError("Unity loader did not initialize correctly.");
                return;
            }

            createUnityInstance(
                canvas,
                config,
                function (progress) {
                    const percent = Math.min(
                        100,
                        Math.floor(progress * 100)
                    );

                    loadingFill.style.width = percent + "%";
                    loadingPercent.textContent = percent + "%";

                    if (percent >= 100) {
                        loadingText.textContent = "Starting game...";
                    }
                }
            )
                .then(function (instance) {
                    unityInstance = instance;
                    window.unityInstance = instance;

                    resizeGame();

                    requestAnimationFrame(function () {
                        loadingScreen.style.display = "none";
                        resizeGame();
                    });
                })
                .catch(function (error) {
                    console.error("Unity WebGL error:", error);
                    showLoadError(
                        "Unable to initialize the game. Please refresh and try again."
                    );
                });
        };

        script.onerror = function () {
            console.error("Unable to load Unity loader:", loaderUrl);

            showLoadError(
                "Unable to load the game files. Check your Build folder and connection."
            );
        };

        function showLoadError(message) {
            loadingPercent.textContent = "Error";
            loadingText.textContent = message;
        }

        document.body.appendChild(script);
    </script>

</body>
</html>
